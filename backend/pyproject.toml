[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "study-assistant-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "sqlalchemy>=2.0,<3",
  "asyncpg>=0.30,<1", "pydantic-settings>=2.7,<3", "argon2-cffi>=23,<26",
  "python-multipart>=0.0.20", "httpx>=0.28,<1", "pymupdf>=1.25,<2", "alembic>=1.14,<2",
  "Pillow>=10,<13"
]

[project.optional-dependencies]
ai = ["sentence-transformers>=3.4,<6", "chromadb>=1,<2", "rank-bm25>=0.2.2,<1"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.20,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
